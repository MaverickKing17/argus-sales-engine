
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARGUS | AI Sales Closer for Elite Real Estate Teams</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <style>
        /* Microsoft System Font Stack (Segoe UI) */
        :root {
            --argus-gold: #B8860B;
            --argus-gold-bright: #D4AF37;
            --argus-bloomberg-blue: #0035ad;
            /* 2026 Luxury Trend: Limestone Pearl / Warm Stone */
            --luxury-bg: #F2F0ED; 
            --luxury-text: #1a1a1a;
            --panel-bg: rgba(255, 255, 255, 0.7);
        }

        body {
            font-family: "Segoe UI", "Segoe UI Web (West European)", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", sans-serif;
            background-color: var(--luxury-bg);
            color: var(--luxury-text);
            margin: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4, .luxury-font {
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 10px 40px rgba(0,0,0,0.04);
        }

        .btn-luxury {
            background: linear-gradient(135deg, #B8860B 0%, #D4AF37 100%);
            color: white;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 1.25rem 2.5rem;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            border: none;
        }

        .btn-luxury:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(184, 134, 11, 0.3);
            filter: brightness(1.1);
        }

        .ticker-blue {
            background-color: var(--argus-bloomberg-blue);
            color: white;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--luxury-bg); }
        ::-webkit-scrollbar-thumb { background: #d1cdc7; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--argus-gold); }

        button, input, select { font-family: inherit; }

        .reveal-up {
            animation: revealUp 0.8s ease-out forwards;
        }
        @keyframes revealUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
<script type="importmap">

</head>

</html>
