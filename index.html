
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARGUS | AI Sales Closer for Elite Real Estate Teams</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            --argus-gold: #D4AF37;
            --argus-gold-soft: #C5A028;
            --argus-champagne: #F5E6BE;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0c0c0e;
            color: #f4f4f5;
            margin: 0;
            overflow-x: hidden;
        }

        /* Luxury "Golden Hour" Toronto Background */
        .luxury-bg-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: 
                linear-gradient(to bottom, rgba(12, 12, 14, 0.7) 0%, rgba(12, 12, 14, 0.9) 100%),
                url('https://images.unsplash.com/photo-1503106628544-27318fef6252?auto=format&fit=crop&q=80&w=2000');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .glass-panel {
            background: rgba(24, 24, 27, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }

        .gold-accent {
            color: var(--argus-gold);
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .btn-gold {
            background: linear-gradient(135deg, #D4AF37 0%, #FAE088 100%);
            color: #0c0c0e;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.25);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0c0c0e; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--argus-gold); }

        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px; width: 20px;
            border-radius: 50%;
            background: var(--argus-gold);
            cursor: pointer;
            margin-top: -8px;
            border: 2px solid white;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px;
            cursor: pointer; background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0"
  }
}
</script>
</head>
<body class="antialiased selection:bg-[#D4AF37] selection:text-zinc-950">
    <div class="luxury-bg-overlay"></div>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
