
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARGUS | AI Sales Closer for Elite Real Estate Teams</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <style>
        /* Modern Microsoft System Font Stack (Segoe UI) */
        :root {
            --argus-gold: #D4AF37;
            --argus-slate: #1a1a1e;
            --argus-cream: #f9f7f2;
        }

        body {
            font-family: "Segoe UI", "Segoe UI Web (West European)", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", sans-serif;
            background-color: #0c0c0e;
            color: #f4f4f5;
            margin: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Unifying all headings to the Microsoft UI style font */
        h1, h2, h3, h4, h5, h6, .luxury-font {
            font-family: "Segoe UI", "Segoe UI Web (West European)", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", sans-serif;
            font-weight: 700;
        }

        .glass-panel {
            background: rgba(18, 18, 20, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .btn-luxury {
            background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%);
            color: white;
            font-weight: 600; /* Slightly refined for Segoe UI */
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 1.25rem 2.5rem;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-luxury:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
        }

        .section-bg-image {
            position: absolute;
            inset: 0;
            z-index: -1;
            opacity: 0.25;
            object-fit: cover;
            width: 100%;
            height: 100%;
            filter: grayscale(40%) contrast(110%);
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0c0c0e; }
        ::-webkit-scrollbar-thumb { background: var(--argus-gold); border-radius: 10px; }

        /* Smooth reveal animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .reveal { animation: fadeUp 1s ease-out forwards; }

        /* Ensuring inputs and buttons inherit the font */
        button, input, textarea, select {
            font-family: inherit;
        }
    </style>
<script type="importmap">
{

    "@google/genai": "https://esm.sh/@google/genai@^1.41.0"
  }
}
</script>
</head>
<body class="antialiased selection:bg-[#D4AF37] selection:text-zinc-950">

</body>
</html>
